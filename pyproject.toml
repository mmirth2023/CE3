[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ce3"
version = "0.1.0"
description = "Conflict Evolution, Endgame & Economic Engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]